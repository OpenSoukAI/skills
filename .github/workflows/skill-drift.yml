# Calls agent-mcp's reusable skill-drift check (REF-248).
#
# This repo is one of the three places drift can originate, so it runs the check on its own
# merges. The logic lives in agent-mcp — the checker is a Go binary in that module — and this is
# only the trigger.
name: Skill drift

on:
  push:
    branches: [main]

jobs:
  drift:
    uses: OpenSoukAI/agent-mcp/.github/workflows/skill-drift.yml@main
    with:
      source: ${{ format('{0}@{1}', github.repository, github.sha) }}
    # Named individually rather than `secrets: inherit`. inherit hands the callee EVERY secret
    # this repo holds — including unrelated ones like CLAUDE_CODE_OAUTH_TOKEN — to code living in
    # another repository. These three are what the check needs and all it gets.
    secrets:
      SKILLDRIFT_TOKEN: ${{ secrets.SKILLDRIFT_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
